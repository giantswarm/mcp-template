version: 2.1
orbs:
  architect: giantswarm/architect@10.14.10

# The template repository's own pipeline: builds, tests and nancy-scans the
# template's Go code as is. Nothing is released from the template, so no image
# or chart is pushed. A repository created from the template gets
# .circleci/config.derived.yml instead: scripts/init.sh fills in its name and
# moves it over this file.
workflows:
  build:
    jobs:
      - architect/go-build:
          context: architect
          name: go-build-mcp-template
          binary: mcp-template

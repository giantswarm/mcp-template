name: template-bootstrap-gate

# Confirms the template still bootstraps into a compiling, lintable, helm-
# valid project. Runs scripts/init.sh against a clean checkout and asserts
# the generated repo passes go build, golangci-lint, and helm lint.
#
# DELETE THIS WORKFLOW after running scripts/init.sh — it only makes sense
# in the template repo itself.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0
      - name: Bootstrap into /tmp/generated
        run: |
          mkdir -p /tmp/generated
          rsync -a ./ /tmp/generated/
          cd /tmp/generated
          ./scripts/init.sh \
            --name=mcp-foo \
            --team=team-test \
            --module=github.com/giantswarm/mcp-foo \
            --short-desc='Bootstrap-gate test' \
            --audience=mcp-foo-aud \
            --port=8080
      - name: Build and test generated repo
        working-directory: /tmp/generated
        run: |
          go mod tidy
          go build -o mcp-foo .
          go test ./...
      - name: Generated binary reports its version through pkg/project
        working-directory: /tmp/generated
        run: |
          set -o pipefail
          # Unstamped: Go's VCS build info (or dev), never the old cmd.version.
          ./mcp-foo version | tee version.txt
          grep -q '^mcp-foo version ' version.txt
          ./mcp-foo --version | grep -q '^mcp-foo version '
          # Stamped the way the generated Makefile and the architect go-build job do it.
          go build -ldflags "-X github.com/giantswarm/mcp-foo/pkg/project.version=9.9.9 -X github.com/giantswarm/mcp-foo/pkg/project.gitSHA=cafebabe" -o mcp-foo-stamped .
          ./mcp-foo-stamped version | tee stamped.txt
          grep -qx 'mcp-foo version 9.9.9' stamped.txt
          grep -qx 'commit: cafebabe' stamped.txt
          # A build without a signed release behind it must refuse to replace itself.
          if ./mcp-foo self-update > selfupdate.txt 2>&1; then
            cat selfupdate.txt
            echo "self-update must refuse a build that has no verified release" >&2
            exit 1
          fi
          cat selfupdate.txt
      - name: Lint generated repo
        working-directory: /tmp/generated
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
          $(go env GOPATH)/bin/golangci-lint run ./... || true
      - name: Helm lint generated chart
        working-directory: /tmp/generated
        run: helm lint helm/mcp-foo
      - name: Helm unit tests of the generated chart
        working-directory: /tmp/generated
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v1.1.2
          helm unittest helm/mcp-foo
